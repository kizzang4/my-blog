<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff">
  <!-- 화면이 번쩍이지 않도록 CSS보다 먼저 테마를 정한다. -->
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/post.css">
</head>
<body>
  <header class="site-header">
    <div class="container site-header__inner">
      <a class="site-title" href="#/">My Blog</a>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="다크 모드로 전환" title="다크 모드로 전환">
        <svg class="icon icon-sun" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon icon-moon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status" role="status">불러오는 중…</p>
    <noscript><p class="status">이 블로그를 보려면 JavaScript가 필요합니다.</p></noscript>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> My Blog</p>
    </div>
  </footer>

  <!-- file:// 로 열면 모듈 스크립트가 막히므로 안내를 보여준다. -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('app').textContent =
        '이 사이트는 파일로 직접 열 수 없고 로컬 서버로 실행해야 합니다. VS Code의 Live Server 확장 등으로 index.html을 열어 주세요.';
    }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
